# intelligence service configuration. Defaults are for local development only.
# Secrets are never stored here: passwords come from the environment (see .env.example).
spring:
  application:
    name: intelligence
  datasource:
    url: ${DB_URL:jdbc:postgresql://${FINORA_DB_HOST:localhost}:${FINORA_DB_PORT:5432}/finora_intelligence}
    username: ${DB_USER:finora_intelligence_app}
    password: ${DB_PASSWORD:${FINORA_DEV_DB_PASSWORD:}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_MIGRATION_URL:jdbc:postgresql://${FINORA_DB_HOST:localhost}:${FINORA_DB_PORT:5432}/finora_intelligence}
    user: ${DB_MIGRATION_USER:finora_intelligence_migrator}
    password: ${DB_MIGRATION_PASSWORD:${FINORA_DEV_DB_PASSWORD:}}
    placeholders:
      app_role: ${DB_USER:finora_intelligence_app}

server:
  # Services are private by default: loopback only. Exposure beyond localhost needs an approved deployment decision.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8086}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
