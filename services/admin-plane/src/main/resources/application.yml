# admin-plane service configuration. Defaults are for local development only.
# Secrets are never stored here: passwords come from the environment (see .env.example).
spring:
  application:
    name: admin-plane

server:
  # Services are private by default: loopback only. Exposure beyond localhost needs an approved deployment decision.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8089}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,internalToken

finora:
  security:
    internal-token:
      # Only the gateway is trusted by default; add a service under trusted-issuers when an approved
      # internal contract lets it call this service (one public key per caller, no shared secrets).
      trusted-issuers:
        gateway:
          public-key-path: ${FINORA_KEYS_DIR:.dev-keys}/gateway.pub.pem
